name: Shiraz X 24/7 Publisher

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish_to_x:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install twikit requests beautifulsoup4

      - name: Run X Publisher Script
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: |
          python x_worker.py

      - name: Save Posted IDs History
        run: |
          git config --global user.name "ShirazXBot"
          git config --global user.email "bot@shirazlastnews.com"
          git add posted_x_ids.json || true
          git diff --staged --quiet || git commit -m "Update posted X history [skip ci]"
          git push
