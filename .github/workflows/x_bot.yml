name: Shiraz X 24/7 Publisher

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish_to_x:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Real Browser and Dependencies
        run: |
          pip install --upgrade pip
          pip install playwright requests beautifulsoup4
          playwright install --with-deps chromium

      - name: Run X Publisher Script
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: |
          python x_worker.py

      - name: Run Nightly Telegram Report (12 AM Iran Time or Manual Test)
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          HOUR_UTC=$(date -u +%H)
          MIN_UTC=$(date -u +%M)
          # ساعت 20:20 تا 20:35 به وقت جهانی معادل ساعت 23:50 تا 00:05 شب به وقت ایران است
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || ( [ "$HOUR_UTC" = "20" ] && [ "$MIN_UTC" -ge 20 ] && [ "$MIN_UTC" -le 35 ] ); then
            if [ -f nightly_report.py ]; then
              python nightly_report.py
            fi
          fi

      - name: Save Posted IDs History
        if: always()
        run: |
          git config --global user.name "ShirazXBot"
          git config --global user.email "bot@shirazlastnews.com"
          if [ -f posted_x_ids.json ]; then
            git add posted_x_ids.json
            git diff --staged --quiet || (git commit -m "Update posted X history [skip ci]" && git push)
          fi
